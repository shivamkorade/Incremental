<form class="form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <h2>Login</h2>

    <div class="form-control">
        <label for="username">Username</label>
        <input id="username" type="text" formControlName="username" placeholder="Enter username" />
        <div class="error" *ngIf="username?.touched && username?.invalid">
            <span *ngIf="username?.errors?.['required']">Username is required.</span>
            <span *ngIf="username?.errors?.['pattern']">Only letters and numbers are allowed.</span>
        </div>
    </div>

    <div class="form-control">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="Enter password" />
        <div class="error" *ngIf="password?.touched && password?.invalid">
            <span *ngIf="password?.errors?.['required']">Password is required.</span>
            <span *ngIf="password?.errors?.['minlength']">Password must be at least 8 characters.</span>
            <span *ngIf="password?.errors?.['pattern']">Must include at least one capital letter and one number.</span>
        </div>
    </div>

    <button class="btn" type="submit" [disabled]="loginForm.invalid">Login</button>

    <div class="alert success" *ngIf="successMessage">{{ successMessage }}</div>
    <div class="alert error" *ngIf="errorMessage">{{ errorMessage }}</div>
</form>
