<div class="clinic-create-container">
  <div class="create-card">
    <h2>Edit Clinic</h2>

    <form [formGroup]="clinicForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Clinic Name <span class="required">*</span></label>
        <input formControlName="clinicName" type="text" placeholder="Enter clinic name" />
        <small class="error-msg" *ngIf="clinicName?.invalid && clinicName?.touched">
          Clinic name is required (min 2 characters).
        </small>
      </div>

      <div class="form-group">
        <label>Location <span class="required">*</span></label>
        <input formControlName="location" type="text" placeholder="Enter location" />
        <small class="error-msg" *ngIf="location?.invalid && location?.touched">
          Location is required.
        </small>
      </div>

      <div class="form-group">
        <label>Contact Number <span class="required">*</span></label>
        <input formControlName="contactNumber" type="text" placeholder="Enter 10-digit number" />
        <small class="error-msg" *ngIf="contactNumber?.invalid && contactNumber?.touched">
          Valid 10-digit contact number is required.
        </small>
      </div>

      <div class="form-group">
        <label>Established Year <span class="required">*</span></label>
        <input formControlName="establishedYear" type="number" placeholder="e.g. 2010" />
        <small class="error-msg" *ngIf="establishedYear?.invalid && establishedYear?.touched">
          Valid established year is required.
        </small>
      </div>

      <div class="btn-group">
        <button type="submit" class="submit-btn" [disabled]="clinicForm.invalid">
          Update Clinic
        </button>
        <button type="button" class="back-btn" (click)="goBack()">
          Back to Dashboard
        </button>
      </div>

    </form>

    <p *ngIf="successMessage" class="success-msg">✅ {{ successMessage }}</p>
    <p *ngIf="errorMessage" class="error-msg-global">❌ {{ errorMessage }}</p>
  </div>
</div>
