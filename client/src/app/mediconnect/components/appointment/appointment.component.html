<div class="card">

    <div class="card-header">
        <h3>{{ movie.title }}</h3>
    </div>

    <div class="card-body">

        <p>
            <strong>Director:</strong>

            {{ movie.director }}
        </p>

        <p>
            <strong>Release Date:</strong>

            {{ movie.releaseDate | date:'MMM d, y' }}
        </p>

        <p>
            <strong>Genre:</strong>

            {{ movie.genre }}
        </p>

    </div>

</div>
