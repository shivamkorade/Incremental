<div class="appointment-form">
  <h2>Book Appointment</h2>

  <form [formGroup]="appointmentForm" (ngSubmit)="onSubmit()">
    <label>Clinic:</label>
    <select formControlName="clinic">
      <option [ngValue]="null" disabled selected>Select clinic</option>
      <option *ngFor="let clinic of clinics" [ngValue]="clinic">
        {{ clinic.clinicName }}
      </option>
    </select>

    <label>Date:</label>
    <!-- ✅ BLOCK PAST DATES -->
    <input type="date" formControlName="appointmentDate" [min]="today" />

    <label>Purpose:</label>
    <input type="text" formControlName="purpose" placeholder="Reason for visit" />

    <button type="submit" [disabled]="appointmentForm.invalid">Book</button>
  </form>

  <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
</div>
