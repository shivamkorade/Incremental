<div class="doctor-edit-container">
  <div class="edit-card">
    <h2>Edit Doctor Profile</h2>

    <form [formGroup]="doctorForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Full Name <span class="required">*</span></label>
        <input formControlName="fullName" type="text" placeholder="Enter full name" />
        <small class="error-msg" *ngIf="fullName?.invalid && fullName?.touched">
          Full name is required (min 2 characters).
        </small>
      </div>

      <div class="form-group">
        <label>Specialty <span class="required">*</span></label>
        <input formControlName="specialty" type="text" placeholder="Enter specialty" />
        <small class="error-msg" *ngIf="specialty?.invalid && specialty?.touched">
          Specialty is required.
        </small>
      </div>

      <div class="form-group">
        <label>Email <span class="required">*</span></label>
        <input formControlName="email" type="email" placeholder="Enter email" />
        <small class="error-msg" *ngIf="email?.invalid && email?.touched">
          Valid email is required.
        </small>
      </div>

      <div class="form-group">
        <label>Contact Number <span class="required">*</span></label>
        <input formControlName="contactNumber" type="text" placeholder="Enter 10-digit number" />
        <small class="error-msg" *ngIf="contactNumber?.invalid && contactNumber?.touched">
          Valid 10-digit contact number is required.
        </small>
      </div>

      <div class="form-group">
        <label>Years of Experience <span class="required">*</span></label>
        <input formControlName="yearsOfExperience" type="number" placeholder="Enter years of experience" />
        <small class="error-msg" *ngIf="yearsOfExperience?.invalid && yearsOfExperience?.touched">
          Years of experience must be at least 1.
        </small>
      </div>

      <div class="btn-group">
        <button type="submit" class="submit-btn" [disabled]="doctorForm.invalid">
          Update Profile
        </button>
        <button type="button" class="back-btn" (click)="goBack()">
          Back to Dashboard
        </button>
      </div>

    </form>

    <p *ngIf="successMessage" class="success-msg">✅ {{ successMessage }}</p>
    <p *ngIf="errorMessage" class="error-msg-global">❌ {{ errorMessage }}</p>
  </div>
</div>
